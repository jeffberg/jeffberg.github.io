<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>not here</title>
<meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1614" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='14'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --ink: #1a1614;
    --ink-soft: #5a4f48;
    --paper: #f4efe6;
  }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: "Cormorant Garamond", "EB Garamond", Garamond, "Hoefler Text", "Times New Roman", serif;
  }
  body {
    display: grid;
    place-items: center;
    min-height: 100vh;
    min-height: 100svh;
    padding: 2rem;
    text-align: center;
  }
  p {
    font-style: italic;
    font-size: clamp(1.4rem, 3vw, 2rem);
    margin: 0 0 1.2rem;
    line-height: 1.4;
    max-width: 24ch;
  }
  a {
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    font-size: 0.78rem;
    letter-spacing: 0.2em;
    text-transform: lowercase;
    color: var(--ink-soft);
    text-decoration: none;
    border-bottom: 1px solid currentColor;
    padding-bottom: 1px;
    transition: color .3s ease;
  }
  a:hover, a:focus-visible {
    color: var(--ink);
  }
  a:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 3px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #f0e6d6;
      --ink-soft: #b8a896;
      --paper: #1a1614;
    }
  }
</style>
</head>
<body>
  <main>
    <p>nothing lives at this address.</p>
    <a href="/">go home</a>
  </main>
</body>
</html>
